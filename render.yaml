services:
  - type: web
    runtime: python
    name: xaluca-tours-api
    region: frankfurt
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.15
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: xaluca
      - key: BUNNY_STORAGE_ZONE
        value: xalucatours-media
      - key: BUNNY_STORAGE_API_KEY
        sync: false
      - key: BUNNY_STORAGE_REGION
        value: de
      - key: BUNNY_STORAGE_ENDPOINT
        value: https://storage.bunnycdn.com
      - key: BUNNY_CDN_URL
        value: https://xalucatours-media.b-cdn.net
      - key: BUNNY_PULL_ZONE_NAME
        value: xalucatours-media
      - key: MEDIA_STORAGE_PROVIDER
        # Canary production mode: write to both providers, read Bunny first
        # with Supabase fallback. Move to `bunny` only after the burn-in audit.
        value: dual
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_TOKEN_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_SITE_URL
        sync: false
      - key: PRODUCTION_BASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: XALUCA_TOURS_NEWSLETTER
        sync: false
      - key: RESEND_CONTACTS_API_KEY
        sync: false
      - key: RESEND_NEWSLETTER_SEGMENT_ID
        sync: false
      - key: LEADS_FROM_EMAIL
        sync: false
      - key: LEADS_NOTIFY_EMAILS
        sync: false
      - key: FOUNDER_LLUIS_EMAIL
        sync: false
      - key: FOUNDER_TAYEB_EMAIL
        sync: false
      - key: TEAM_NOEMI_EMAIL
        sync: false
      - key: TEAM_ELENA_EMAIL
        sync: false
      - key: TEAM_SANAA_EMAIL
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      - key: UNSPLASH_ACCESS_KEY
        sync: false
      - key: UNSPLASH_APP_NAME
        value: Xaluca Tours
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TRANSLATION_MODEL
        value: gpt-4o-mini
      - key: OPENAI_TRANSCRIPTION_MODEL
        value: gpt-transcribe
      - key: IMG_WARM_ON_STARTUP
        value: "false"
      - key: IMG_REOPT_ON_STARTUP
        value: "false"

  - type: web
    runtime: static
    name: xaluca-tours-web
    rootDir: frontend
    buildCommand: npm run build
    staticPublishPath: ./build
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 20.20.2
      - key: REACT_APP_BACKEND_URL
        sync: false
      - key: REACT_APP_MEDIA_CDN_URL
        value: https://xalucatours-media.b-cdn.net
      - key: REACT_APP_CHATBASE_WIDGET_ENABLED
        # Keep the integration ready while hiding the public floating widget.
        value: "false"
    headers:
      - path: /*
        name: Link
        value: '</.well-known/api-catalog>; rel="api-catalog"; type="application/linkset+json", </sitemap.xml>; rel="sitemap"; type="application/xml", </docs/agents.md>; rel="describedby"; type="text/markdown"'
      - path: /robots.txt
        name: Content-Type
        value: text/plain; charset=utf-8
      - path: /sitemap.xml
        name: Content-Type
        value: application/xml; charset=utf-8
      - path: /.well-known/api-catalog
        name: Content-Type
        value: application/linkset+json
      - path: /.well-known/ai-catalog.json
        name: Content-Type
        value: application/json
      - path: /.well-known/ai-catalog.json
        name: Access-Control-Allow-Origin
        value: '*'
      - path: /.well-known/agent-skills/index.json
        name: Content-Type
        value: application/json
      - path: /.well-known/agent-skills/explore-xaluca-trips/SKILL.md
        name: Content-Type
        value: text/markdown; charset=utf-8
      - path: /docs/agents.md
        name: Content-Type
        value: text/markdown; charset=utf-8
      - path: /auth.md
        name: Content-Type
        value: text/markdown; charset=utf-8
    routes:
      # Retired campaign URLs are inbound redirects, not public navigation.
      - type: redirect
        source: /findeano2025
        destination: /findeano2026
      - type: redirect
        source: /findeano2025/
        destination: /findeano2026
      - type: redirect
        source: /en/newyear2025
        destination: /en/newyear2026
      - type: redirect
        source: /en/newyear2025/
        destination: /en/newyear2026
      - type: redirect
        source: /fr/nouvelan2025
        destination: /fr/nouvelan2026
      - type: redirect
        source: /fr/nouvelan2025/
        destination: /fr/nouvelan2026
      - type: rewrite
        source: /*
        destination: /index.html
